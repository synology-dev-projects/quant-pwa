server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for ultra-fast mobile loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Reverse proxy /api/ to the environment-specific Agent Gateway container
    location /api/ {
        proxy_pass http://quant-gateway-${CONTAINER_PREFIX}:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for instant SSE chunk streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # Static frontend assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache service worker and manifest with short TTL
    location ~* (sw\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache";
        expires 0;
    }
}
