server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for ultra-fast mobile loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Increase body and buffer limits to prevent HTTP 413
    client_max_body_size 10M;
    client_body_buffer_size 1M;
    large_client_header_buffers 4 32k;

    # Reverse proxy /api/ to the Agent Gateway container
    location /api/ {
        proxy_pass http://quant-gateway:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for instant SSE chunk streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # Reverse proxy /mcp/ to the Agent Gateway container (SSE & JSON-RPC)
    location /mcp/ {
        proxy_pass http://quant-gateway:8000/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for instant MCP SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # Static frontend assets - disable caching for JS, CSS, and HTML so PWA updates are instant
    location ~* \.(?:html|js|css|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri $uri/ /index.html;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri $uri/ /index.html;
    }
}
