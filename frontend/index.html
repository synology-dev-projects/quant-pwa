<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Quant AI - Options & Market Intelligence</title>
  
  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121824" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Quant AI" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <img src="icons/icon-192.svg" alt="Logo" class="header-logo" />
        <span class="header-title">Quant AI</span>
      </div>
      <div class="header-controls">
        <select id="modelSelect" class="model-select">
          <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
          <option value="gemini-3.7-pro">Gemini 3.7 Pro</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
        </select>
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Tab Bar -->
    <nav class="tab-bar" id="tabBar"></nav>

    <!-- Tab Content -->
    <main class="tab-content" id="tabContent"></main>

    <!-- Fixed Bottom Prompt Area -->
    <footer id="promptContainer"></footer>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-card">
        <div class="modal-header">
          <h3 class="modal-title">Settings & Configuration</h3>
          <button class="icon-btn" id="settingsClose">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div class="form-group">
          <label class="form-label" for="passcodeInput">App Passcode (Security PIN)</label>
          <input type="password" id="passcodeInput" class="form-input" placeholder="Enter your secret passcode" />
        </div>
        <div class="form-group">
          <label class="form-label" for="gatewayUrlInput">Gateway Base URL (Optional for custom domain)</label>
          <input type="text" id="gatewayUrlInput" class="form-input" placeholder="e.g. https://quant.yourdomain.com" />
        </div>
        <button class="primary-btn" id="settingsSave">Save Configuration</button>
        <button class="chip-btn" id="clearHistoryBtn" style="color: var(--accent-red); margin-top: 4px;">Clear Conversation History</button>
      </div>
    </div>

    <!-- Pinch-to-Zoom Lightbox Modal -->
    <div class="lightbox-overlay" id="lightboxModal">
      <div class="lightbox-header">
        <button class="icon-btn" id="lightboxClose">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="lightbox-content">
        <img id="lightboxImage" class="lightbox-img" src="" alt="Expanded Chart" />
      </div>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
