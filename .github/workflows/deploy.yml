name: CI/CD Pipeline - Quant AI Mobile Chat PWA & Gateway

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Automated Test Suite (CI)
    runs-on: self-hosted

    steps:
      - name: Clean Runner Workspace
        run: |
          echo "🧹 Cleaning test runner workspace..."
          rm -rf ./*
          rm -rf ./.??* 2>/dev/null || true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Virtualenv & Run Pytest
        run: |
          cd gateway
          python3 -m venv .venv || python -m venv .venv
          source .venv/bin/activate || .venv/Scripts/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          
          echo "🧪 Running Pytest Automated Test Suite..."
          python -m pytest tests/ -v

  deploy:
    name: Deploy to Synology NAS (CD)
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Project Files to Synology NAS Target
        run: |
          SYNOLOGY_ROOT_PATH="/volume2/homes/rachardv/git-repos"
          BRANCH_NAME="${{ github.ref_name }}"
          TARGET_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/quant-pwa"
          
          echo "📂 Deploying to: $TARGET_PATH"
          mkdir -p "$TARGET_PATH"
          
          # Sync all project files
          cp -r frontend "$TARGET_PATH/"
          cp -r gateway "$TARGET_PATH/"
          cp docker-compose.yml "$TARGET_PATH/"
          cp README.md "$TARGET_PATH/"
          
          echo "DEPLOY_DIR=$TARGET_PATH" >> $GITHUB_ENV

      - name: Generate Runtime .env Secrets
        run: |
          ENV_FILE="${{ env.DEPLOY_DIR }}/.env"
          echo "🔐 Generating secure .env file at $ENV_FILE..."
          
          echo "APP_PASSCODE=${{ secrets.APP_PASSCODE }}" > "$ENV_FILE"
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> "$ENV_FILE"
          echo "DEFAULT_GEMINI_MODEL=gemini-3.7-flash" >> "$ENV_FILE"
          echo "GEXDEX_API_URL=http://gexdex-api-prod:8000" >> "$ENV_FILE"
          echo "GEXDEX_API_KEY=${{ secrets.GEXDEX_API_KEY }}" >> "$ENV_FILE"
          echo "PUBLIC_BASE_URL=${{ secrets.PUBLIC_BASE_URL }}" >> "$ENV_FILE"
          echo "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" >> "$ENV_FILE"
          echo "MAX_SLIDING_WINDOW_MESSAGES=12" >> "$ENV_FILE"
          
          chmod 600 "$ENV_FILE"

      - name: Ensure Shared Docker Network Exists
        run: |
          echo "🌐 Ensuring quant-system-network exists..."
          sudo /usr/local/bin/docker network create quant-system-network 2>/dev/null || true

      - name: Build & Restart Docker Containers
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          echo "🐳 Launching Docker Compose stack on Synology NAS..."
          sudo /usr/local/bin/docker compose up -d --build --remove-orphans || docker compose up -d --build --remove-orphans
          
          echo "🚀 Deployment Successful! Quant AI PWA & Gateway are live on Synology NAS."
