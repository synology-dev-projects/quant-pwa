name: Deploy Quant AI Mobile Chat PWA & Gateway

on:
  push:
    branches: [ "master", "develop", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to Synology NAS
    runs-on: self-hosted

    steps:
      # 1. Clean Runner Workspace
      - name: Clean Runner Workspace
        run: |
          echo "🧹 Cleaning runner workspace..."
          rm -rf ./*
          rm -rf ./.??* 2>/dev/null || true

      # 2. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. Deploy Code to NAS Target Directory
      - name: Sync Project Files to Synology NAS
        run: |
          SYNOLOGY_ROOT_PATH="/volume2/homes/rachardv/git-repos"
          BRANCH_NAME="${{ github.ref_name }}"
          TARGET_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/quant-pwa"
          
          echo "📂 Deploying to: $TARGET_PATH"
          mkdir -p "$TARGET_PATH"
          rm -rf "$TARGET_PATH"/*
          
          # Sync all project files
          cp -r frontend "$TARGET_PATH/"
          cp -r gateway "$TARGET_PATH/"
          cp docker-compose.yml "$TARGET_PATH/"
          cp README.md "$TARGET_PATH/"
          
          echo "DEPLOY_DIR=$TARGET_PATH" >> $GITHUB_ENV

      # 4. Inject Production Secrets into .env
      - name: Generate Runtime .env Secrets
        run: |
          ENV_FILE="${{ env.DEPLOY_DIR }}/.env"
          echo "🔐 Generating secure .env file at $ENV_FILE..."
          
          echo "APP_PASSCODE=${{ secrets.APP_PASSCODE }}" > "$ENV_FILE"
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> "$ENV_FILE"
          echo "DEFAULT_GEMINI_MODEL=gemini-3.7-flash" >> "$ENV_FILE"
          echo "GEXDEX_API_URL=http://gexdex-api-prod:8000" >> "$ENV_FILE"
          echo "GEXDEX_API_KEY=${{ secrets.GEXDEX_API_KEY }}" >> "$ENV_FILE"
          echo "PUBLIC_BASE_URL=${{ secrets.PUBLIC_BASE_URL }}" >> "$ENV_FILE"
          echo "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" >> "$ENV_FILE"
          echo "MAX_SLIDING_WINDOW_MESSAGES=12" >> "$ENV_FILE"
          
          chmod 600 "$ENV_FILE"

      # 5. Ensure Shared Docker Network Exists
      - name: Ensure Shared Docker Network Exists
        run: |
          echo "🌐 Ensuring quant-system-network exists..."
          docker network create quant-system-network 2>/dev/null || true

      # 6. Build & Restart Docker Containers
      - name: Deploy Docker Stack
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          echo "🐳 Launching Docker Compose stack on Synology NAS..."
          docker compose down || true
          docker compose build
          docker compose up -d --force-recreate
          
          echo "🚀 Deployment Successful! Quant AI PWA, Gateway, and Cloudflared Tunnel are live on Synology NAS."
