name: Deploy Quant AI Mobile Chat PWA & Gateway

on:
  push:
    branches: [ "master", "develop", "develop2" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Branch-Based Deployment to Synology NAS
    runs-on: self-hosted

    steps:
      # 1. Clean Runner Workspace
      - name: Clean Runner Workspace
        run: |
          echo "🧹 Cleaning runner workspace..."
          rm -rf ./*
          rm -rf ./.??* 2>/dev/null || true

      # 2. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2.5 Setup Node.js
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Configure Branch Environment (Develop vs Master)
      - name: Configure Branch Environment Variables
        run: |
          SYNOLOGY_ROOT_PATH="/volume2/homes/rachardv/git-repos"
          BRANCH_NAME="${{ github.ref_name }}"
          TARGET_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/quant-pwa"
          
          if [ "$BRANCH_NAME" == "develop" ] || [ "$BRANCH_NAME" == "develop2" ]; then
            echo "🌿 Deploying to: DEVELOP/DEVELOP2 (Local Home Wi-Fi Only)"
            echo "CONTAINER_PREFIX=dev" >> $GITHUB_ENV
            echo "FRONTEND_PORT=8096" >> $GITHUB_ENV
            echo "POSTGRES_PORT=5436" >> $GITHUB_ENV
            echo "COMPOSE_PROJECT_NAME=quant-pwa-dev" >> $GITHUB_ENV
            echo "COMPOSE_PROFILE_CMD=" >> $GITHUB_ENV
          else
            echo "🚀 Deploying to: MASTER / PRODUCTION (Public Internet + Cloudflare Tunnel)"
            echo "CONTAINER_PREFIX=prod" >> $GITHUB_ENV
            echo "FRONTEND_PORT=8095" >> $GITHUB_ENV
            echo "POSTGRES_PORT=5435" >> $GITHUB_ENV
            echo "COMPOSE_PROJECT_NAME=quant-pwa-prod" >> $GITHUB_ENV
            echo "COMPOSE_PROFILE_CMD=--profile production" >> $GITHUB_ENV
          fi
          
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "DEPLOY_DIR=$TARGET_PATH" >> $GITHUB_ENV

      # 3.5 Pre-Flight Test Gate (Host Verification)
      - name: Run Pre-Flight Test Gate
        run: |
          echo "🧪 Running Pre-Flight Validation Suite..."
          (python3 scripts/bump_version.py --check || python scripts/bump_version.py --check)

          echo "🎨 Running Frontend DOM Test Suites..."
          NODE_BIN="node"
          for candidate in \
            /opt/hostedtoolcache/node/*/x64/bin/node \
            /usr/local/bin/node; do
            if [ -x "$candidate" ]; then
              NODE_BIN="$candidate"
              break
            fi
          done

          echo "Using Node binary: $NODE_BIN"
          "$NODE_BIN" frontend/tests/test_settings_flow_modal.js
          "$NODE_BIN" frontend/tests/test_cockpit_view.js
          "$NODE_BIN" frontend/tests/test_vertical_table_ui.js

      # 4. Sync Project Files to NAS Target Directory
      - name: Sync Project Files to Synology NAS
        run: |
          TARGET_PATH="${{ env.DEPLOY_DIR }}"
          echo "📂 Syncing files to: $TARGET_PATH"
          mkdir -p "$TARGET_PATH"
          rm -rf "$TARGET_PATH"/*
          
          cp -r frontend "$TARGET_PATH/"
          cp -r gateway "$TARGET_PATH/"
          cp -r scripts "$TARGET_PATH/"
          cp docker-compose.yml "$TARGET_PATH/"
          cp version.json "$TARGET_PATH/"
          [ -f .pre-commit-config.yaml ] && cp .pre-commit-config.yaml "$TARGET_PATH/"
          
          echo "🔒 Setting permissions for user 1026 (rachardv)..."
          sudo chown -R 1026:100 "$TARGET_PATH"
          chmod -R 775 "$TARGET_PATH"

      # 5. Generate Runtime .env Secrets
      - name: Generate Runtime .env Secrets
        run: |
          ENV_FILE="${{ env.DEPLOY_DIR }}/.env"
          echo "🔒 Generating secure .env file at $ENV_FILE..."
          
          echo "CONTAINER_PREFIX=${{ env.CONTAINER_PREFIX }}" >> "$ENV_FILE"
          echo "GATEWAY_PORT=8000" >> "$ENV_FILE"
          echo "FRONTEND_PORT=${{ env.FRONTEND_PORT }}" >> "$ENV_FILE"
          echo "POSTGRES_PORT=${{ env.POSTGRES_PORT }}" >> "$ENV_FILE"
          echo "COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}" >> "$ENV_FILE"
          echo "APP_PASSCODE=${{ secrets.APP_PASSCODE }}" >> "$ENV_FILE"
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> "$ENV_FILE"
          echo "DEFAULT_GEMINI_MODEL=gemini-3.5-flash-lite" >> "$ENV_FILE"
          echo "GEXDEX_API_URL=http://gexdex-api-prod:8000" >> "$ENV_FILE"
          echo "GEXDEX_API_KEY=${{ secrets.GEXDEX_API_KEY }}" >> "$ENV_FILE"
          echo "PUBLIC_BASE_URL=${{ secrets.PUBLIC_BASE_URL }}" >> "$ENV_FILE"
          echo "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" >> "$ENV_FILE"
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> "$ENV_FILE"
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> "$ENV_FILE"
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> "$ENV_FILE"
          echo "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@quant-db-${{ env.CONTAINER_PREFIX }}:5432/${{ secrets.POSTGRES_DB }}" >> "$ENV_FILE"
          echo "ENVIRONMENT=${{ env.CONTAINER_PREFIX == 'prod' && 'production' || 'staging' }}" >> "$ENV_FILE"
          if [ -d "/volume2/homes/rachardv/git-repos/${{ env.BRANCH_NAME }}/common-lib/common_lib" ]; then
            echo "COMMON_LIB_PATH=/volume2/homes/rachardv/git-repos/${{ env.BRANCH_NAME }}/common-lib/common_lib" >> "$ENV_FILE"
          else
            echo "COMMON_LIB_PATH=/volume2/homes/rachardv/git-repos/master/common-lib/common_lib" >> "$ENV_FILE"
          fi
          echo "COMMON_CONFIG_PATH=/volume2/homes/rachardv/git-repos/master/common_config" >> "$ENV_FILE"
          
          chmod 600 "$ENV_FILE"
          sudo chown 1026:100 "$ENV_FILE"

      # 6. Ensure External Docker Network Exists
      - name: Ensure Shared Docker Network Exists
        run: |
          docker network inspect quant-system-network >/dev/null 2>&1 || \
          docker network create quant-system-network

      # 7. Build & Deploy Docker Stack
      - name: Deploy Docker Stack
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          echo "🐳 Force-removing any conflicting containers for prefix ${{ env.CONTAINER_PREFIX }}..."
          docker rm -f quant-db-${{ env.CONTAINER_PREFIX }} quant-gateway-${{ env.CONTAINER_PREFIX }} quant-frontend-${{ env.CONTAINER_PREFIX }} quant-cloudflared-${{ env.CONTAINER_PREFIX }} 2>/dev/null || true
          
          echo "🐳 Launching Docker Compose stack (${{ env.COMPOSE_PROJECT_NAME }})..."
          docker compose down --remove-orphans || true
          docker compose build
          
          echo "🧪 Running Containerized Gateway Pytest Gate..."
          docker compose run --rm gateway pytest tests/ -v
          
          echo "🚀 Starting containers..."
          docker compose ${{ env.COMPOSE_PROFILE_CMD }} up -d --force-recreate
          sleep 5
          
          echo "📡 Verifying Frontend boot on port ${{ env.FRONTEND_PORT }}..."
          HOST_IP=""
          for i in {1..12}; do
            for candidate in "127.0.0.1" "172.17.0.1" "192.168.1.68"; do
              if curl -s --connect-timeout 2 "http://${candidate}:${{ env.FRONTEND_PORT }}/" >/dev/null 2>&1; then
                HOST_IP="$candidate"
                break 2
              fi
            done
            echo "⏳ Waiting for Frontend to respond on port ${{ env.FRONTEND_PORT }} (attempt $i/12)..."
            sleep 2
          done
          
          if [ -z "$HOST_IP" ]; then
            echo "❌ Frontend failed to respond on port ${{ env.FRONTEND_PORT }}."
            docker logs quant-frontend-${{ env.CONTAINER_PREFIX }} --tail 30
            exit 1
          fi

          echo "✅ Deployment Successful & In-Situ Smoke Check Passed on $HOST_IP:${{ env.FRONTEND_PORT }} for ${{ github.ref_name }}!"

      # 7.5 Post-Deployment Smoke Test
      - name: Run Post-Deployment Smoke Test
        run: |
          echo "🔍 Running Post-Deployment Endpoint Smoke Tests..."
          (python3 scripts/smoke_test.py --host 127.0.0.1 --port ${{ env.FRONTEND_PORT }} || python3 scripts/smoke_test.py --host 192.168.1.68 --port ${{ env.FRONTEND_PORT }} || python scripts/smoke_test.py --host 192.168.1.68 --port ${{ env.FRONTEND_PORT }})

      # 8. Clean Up Ephemeral Develop Container on Master Deploy
      - name: Tear Down Ephemeral Develop Container
        if: github.ref_name == 'master'
        run: |
          echo "🧹 Tearing down old develop containers to free Synology NAS compute..."
          docker rm -f quant-db-dev quant-gateway-dev quant-frontend-dev quant-cloudflared-dev 2>/dev/null || true
          DEV_DIR="/volume2/homes/rachardv/git-repos/develop/quant-pwa"
          if [ -d "$DEV_DIR" ]; then
            cd "$DEV_DIR"
            docker compose -p quant-pwa-dev down --remove-orphans 2>/dev/null || true
          fi
          echo "✨ Develop containers cleanly removed."
