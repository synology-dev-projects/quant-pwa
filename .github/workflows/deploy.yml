name: Deploy Quant AI Mobile Chat PWA & Gateway

on:
  push:
    branches: [ "master", "develop2" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Branch-Based Deployment to Synology NAS
    runs-on: self-hosted

    steps:
      # ========================================================================
      # STAGE 1: Pre-Flight Validation Gate
      # ========================================================================
      - name: "Stage 1 [Setup]: Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: "Stage 1 [Setup]: Set up Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Stage 1: Pre-Flight Validation Gate"
        run: |
          echo "🧹 Cleaning any stale runner workspace artifacts..."
          rm -rf ./.??* 2>/dev/null || true

          echo "🔍 [1/2] Running Version Parity Check..."
          (python3 scripts/bump_version.py --check || python scripts/bump_version.py --check)

          echo "🎨 [2/2] Running Frontend DOM Test Suites..."
          NODE_BIN="node"
          for candidate in \
            /opt/hostedtoolcache/node/*/x64/bin/node \
            /usr/local/bin/node; do
            if [ -x "$candidate" ]; then
              NODE_BIN="$candidate"
              break
            fi
          done

          echo "Using Node binary: $NODE_BIN"
          "$NODE_BIN" frontend/tests/test_settings_flow_modal.js
          "$NODE_BIN" frontend/tests/test_cockpit_view.js
          "$NODE_BIN" frontend/tests/test_watchlist_view.js
          "$NODE_BIN" frontend/tests/test_levels_view.js
          "$NODE_BIN" frontend/tests/test_vertical_table_ui.js
          "$NODE_BIN" frontend/tests/test_auth_guard.js
          "$NODE_BIN" frontend/tests/audit_layout.js
          echo "✅ Stage 1 Pre-Flight Validation Gate Passed Successfully!"

      # ========================================================================
      # STAGE 2: Prepare Synology Deployment Directory & Secrets
      # ========================================================================
      - name: "Stage 2: Prepare Synology Deployment Directory & Secrets"
        run: |
          SYNOLOGY_ROOT_PATH="/volume2/homes/rachardv/git-repos"
          BRANCH_NAME="${{ github.ref_name }}"
          TARGET_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/quant-pwa"
          
          # 1. Configure Branch Environment (Develop vs Master)
          if [ "$BRANCH_NAME" == "develop" ] || [ "$BRANCH_NAME" == "develop2" ]; then
            echo "🌿 Deploying to: DEVELOP/DEVELOP2 (Local Home Wi-Fi Only)"
            CONTAINER_PREFIX="dev"
            FRONTEND_PORT="8096"
            POSTGRES_PORT="5436"
            COMPOSE_PROJECT_NAME="quant-pwa-dev"
            COMPOSE_PROFILE_CMD=""
            ENVIRONMENT="staging"
          else
            echo "🚀 Deploying to: MASTER / PRODUCTION (Public Internet + Cloudflare Tunnel)"
            CONTAINER_PREFIX="prod"
            FRONTEND_PORT="8095"
            POSTGRES_PORT="5435"
            COMPOSE_PROJECT_NAME="quant-pwa-prod"
            COMPOSE_PROFILE_CMD="--profile production"
            ENVIRONMENT="production"
          fi
          
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "DEPLOY_DIR=$TARGET_PATH" >> $GITHUB_ENV
          echo "CONTAINER_PREFIX=$CONTAINER_PREFIX" >> $GITHUB_ENV
          echo "FRONTEND_PORT=$FRONTEND_PORT" >> $GITHUB_ENV
          echo "POSTGRES_PORT=$POSTGRES_PORT" >> $GITHUB_ENV
          echo "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME" >> $GITHUB_ENV
          echo "COMPOSE_PROFILE_CMD=$COMPOSE_PROFILE_CMD" >> $GITHUB_ENV
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
          
          # 2. Sync Project Files to NAS Target Directory
          echo "📂 Syncing project files to: $TARGET_PATH"
          mkdir -p "$TARGET_PATH"
          rm -rf "$TARGET_PATH"/*
          
          cp -r frontend "$TARGET_PATH/"
          cp -r gateway "$TARGET_PATH/"
          cp -r scripts "$TARGET_PATH/"
          cp docker-compose.yml "$TARGET_PATH/"
          cp version.json "$TARGET_PATH/"
          [ -d docs ] && cp -r docs "$TARGET_PATH/"
          [ -f .pre-commit-config.yaml ] && cp .pre-commit-config.yaml "$TARGET_PATH/"
          
          echo "🔒 Setting permissions for user 1026 (rachardv)..."
          sudo chown -R 1026:100 "$TARGET_PATH"
          chmod -R 775 "$TARGET_PATH"

          # 3. Generate Runtime .env Secrets
          ENV_FILE="${TARGET_PATH}/.env"
          echo "🔒 Generating secure .env file at $ENV_FILE..."
          
          echo "CONTAINER_PREFIX=${CONTAINER_PREFIX}" > "$ENV_FILE"
          echo "GATEWAY_PORT=8000" >> "$ENV_FILE"
          echo "FRONTEND_PORT=${FRONTEND_PORT}" >> "$ENV_FILE"
          echo "POSTGRES_PORT=${POSTGRES_PORT}" >> "$ENV_FILE"
          echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}" >> "$ENV_FILE"
          echo "APP_PASSCODE=${{ secrets.APP_PASSCODE }}" >> "$ENV_FILE"
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> "$ENV_FILE"
          echo "DEFAULT_GEMINI_MODEL=gemini-3.5-flash-lite" >> "$ENV_FILE"
          echo "GEXDEX_API_URL=http://localhost:8000" >> "$ENV_FILE"
          echo "GEXDEX_API_KEY=${{ secrets.GEXDEX_API_KEY }}" >> "$ENV_FILE"
          echo "PUBLIC_BASE_URL=${{ secrets.PUBLIC_BASE_URL }}" >> "$ENV_FILE"
          echo "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" >> "$ENV_FILE"
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> "$ENV_FILE"
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> "$ENV_FILE"
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> "$ENV_FILE"
          echo "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@quant-db-${CONTAINER_PREFIX}:5432/${{ secrets.POSTGRES_DB }}" >> "$ENV_FILE"
          echo "ENVIRONMENT=${ENVIRONMENT}" >> "$ENV_FILE"
          if [ -d "/volume2/homes/rachardv/git-repos/${BRANCH_NAME}/common-lib/common_lib" ]; then
            echo "COMMON_LIB_PATH=/volume2/homes/rachardv/git-repos/${BRANCH_NAME}/common-lib/common_lib" >> "$ENV_FILE"
          else
            echo "COMMON_LIB_PATH=/volume2/homes/rachardv/git-repos/master/common-lib/common_lib" >> "$ENV_FILE"
          fi
          echo "COMMON_CONFIG_PATH=/volume2/homes/rachardv/git-repos/master/common_config" >> "$ENV_FILE"
          
          chmod 600 "$ENV_FILE"
          sudo chown 1026:100 "$ENV_FILE"

          # 4. Ensure Shared Docker Network Exists
          echo "🌐 Verifying shared Docker network (quant-system-network)..."
          docker network inspect quant-system-network >/dev/null 2>&1 || \
          docker network create quant-system-network
          
          echo "✅ Stage 2 Synology Deployment Directory & Secrets Prepared Successfully!"

      # ========================================================================
      # STAGE 3: Docker Build & Containerized Pytest Gate
      # ========================================================================
      - name: "Stage 3: Docker Build & Containerized Pytest Gate"
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          echo "🐳 Force-removing any conflicting containers for prefix ${{ env.CONTAINER_PREFIX }}..."
          docker rm -f quant-db-${{ env.CONTAINER_PREFIX }} quant-gateway-${{ env.CONTAINER_PREFIX }} quant-frontend-${{ env.CONTAINER_PREFIX }} quant-cloudflared-${{ env.CONTAINER_PREFIX }} 2>/dev/null || true
          
          echo "🐳 Pre-cleaning Docker Compose stack (${{ env.COMPOSE_PROJECT_NAME }})..."
          docker compose down --remove-orphans || true
          
          echo "🏷️ Preserving existing images as rollback candidates..."
          docker tag "quant-gateway-${{ env.CONTAINER_PREFIX }}:latest" "quant-gateway-${{ env.CONTAINER_PREFIX }}:rollback" 2>/dev/null || true
          docker tag "quant-frontend-${{ env.CONTAINER_PREFIX }}:latest" "quant-frontend-${{ env.CONTAINER_PREFIX }}:rollback" 2>/dev/null || true

          echo "🏗️ Building Docker images..."
          docker compose build
          
          echo "🧪 Running Containerized Gateway Pytest Gate..."
          docker compose run --rm quant-gateway pytest tests/ -v
          echo "✅ Stage 3 Docker Build & Containerized Pytest Gate Passed!"

      # ========================================================================
      # STAGE 4: Launch Containers & Execute Live Smoke Probes
      # ========================================================================
      - name: "Stage 4: Launch Containers & Execute Live Smoke Probes"
        run: |
          cd "${{ env.DEPLOY_DIR }}"

          trigger_rollback() {
            local REASON="$1"
            echo "❌ $REASON"
            docker logs quant-gateway-${{ env.CONTAINER_PREFIX }} --tail 50 2>/dev/null || true
            docker logs quant-frontend-${{ env.CONTAINER_PREFIX }} --tail 30 2>/dev/null || true
            
            echo "🔄 Initiating automated rollback to previous stable images..."
            ROLLED_BACK=false
            if docker image inspect "quant-gateway-${{ env.CONTAINER_PREFIX }}:rollback" >/dev/null 2>&1; then
              docker tag "quant-gateway-${{ env.CONTAINER_PREFIX }}:rollback" "quant-gateway-${{ env.CONTAINER_PREFIX }}:latest"
              ROLLED_BACK=true
            fi
            if docker image inspect "quant-frontend-${{ env.CONTAINER_PREFIX }}:rollback" >/dev/null 2>&1; then
              docker tag "quant-frontend-${{ env.CONTAINER_PREFIX }}:rollback" "quant-frontend-${{ env.CONTAINER_PREFIX }}:latest"
              ROLLED_BACK=true
            fi

            if [ "$ROLLED_BACK" = true ]; then
              echo "🔄 Recreating containers with restored rollback images..."
              docker compose ${{ env.COMPOSE_PROFILE_CMD }} up -d --force-recreate
              echo "⚠️ Stack restored to previous rollback image."
            else
              echo "⚠️ No rollback images found to restore."
            fi

            NTFY_URL="${{ secrets.NTFY_ENDPOINT || 'https://richntfynotifier.synology.me' }}/quant_alerts"
            curl -s -H "Title: 🚨 Deployment Rollback: ${{ github.ref_name }}" \
                 -H "Priority: 5" \
                 -H "Tags: rotating_light,warning" \
                 -d "$REASON on Synology NAS (${{ github.ref_name }} / ${{ env.CONTAINER_PREFIX }}). Automated rollback executed." \
                 "$NTFY_URL" || true
            exit 1
          }
          
          echo "🚀 Starting containers (${{ env.COMPOSE_PROJECT_NAME }})..."
          docker compose ${{ env.COMPOSE_PROFILE_CMD }} up -d --force-recreate
          sleep 5
          
          echo "📡 Verifying Gateway & Frontend readiness on port ${{ env.FRONTEND_PORT }}..."
          HOST_IP=""
          for i in {1..15}; do
            for candidate in "192.168.1.68" "172.17.0.1" "127.0.0.1"; do
              if curl -s --connect-timeout 2 "http://${candidate}:${{ env.FRONTEND_PORT }}/api/health" | grep -q '"status":"ok"'; then
                HOST_IP="$candidate"
                echo "✅ Gateway is fully responsive at http://${HOST_IP}:${{ env.FRONTEND_PORT }}/api/health!"
                break 2
              fi
            done
            echo "⏳ Waiting for Gateway to initialize on port ${{ env.FRONTEND_PORT }} (attempt $i/15)..."
            sleep 2
          done
          
          if [ -z "$HOST_IP" ]; then
            trigger_rollback "Gateway health check timed out on port ${{ env.FRONTEND_PORT }}"
          fi

          echo "🔍 Running 14-Endpoint Post-Deployment Smoke Test Suite against http://${HOST_IP}:${{ env.FRONTEND_PORT }}..."
          PY_BIN="python3"
          command -v python3 >/dev/null 2>&1 || PY_BIN="python"
          
          if ! "$PY_BIN" scripts/smoke_test.py --host "$HOST_IP" --port ${{ env.FRONTEND_PORT }}; then
            trigger_rollback "Live smoke test suite failed on http://${HOST_IP}:${{ env.FRONTEND_PORT }}"
          fi

          echo "✅ All 14 Live Smoke Probes Passed Successfully on $HOST_IP:${{ env.FRONTEND_PORT }}!"

          # Clean Up Ephemeral Develop Container on Master Deploy
          if [ "${{ github.ref_name }}" == "master" ]; then
            echo "🧹 Master deploy detected: Tearing down old develop containers to free Synology NAS compute..."
            docker rm -f quant-db-dev quant-gateway-dev quant-frontend-dev quant-cloudflared-dev 2>/dev/null || true
            DEV_DIR="/volume2/homes/rachardv/git-repos/develop2/quant-pwa"
            if [ -d "$DEV_DIR" ]; then
              cd "$DEV_DIR"
              docker compose -p quant-pwa-dev down --remove-orphans 2>/dev/null || true
            fi
            echo "✨ Ephemeral develop containers cleanly removed."
          fi
          
          echo "🎉 Stage 4 Launch & Smoke Probing Complete for ${{ github.ref_name }}!"

      # ========================================================================
      # STAGE 5: Automated Living Documentation & Architecture Sync (DEPLOY-03)
      # ========================================================================
      - name: "Stage 5: Automated Living Architecture Documentation Sync"
        if: github.ref_name == 'master'
        run: |
          echo "📚 Initiating automated living architecture documentation sync (DEPLOY-03)..."
          ARCH_DIR="/volume2/homes/rachardv/git-repos/master/quant-architecture"
          if [ -d "$ARCH_DIR" ]; then
            cd "$ARCH_DIR"
            echo "🔄 Synchronizing architecture docs on Synology NAS..."
            git checkout master 2>/dev/null || true
            git pull origin master 2>/dev/null || true
            
            if [ -d "${{ env.DEPLOY_DIR }}/docs" ]; then
              cp -r "${{ env.DEPLOY_DIR }}/docs/"* "$ARCH_DIR/docs/" 2>/dev/null || true
            fi

            if [ -n "$(git status --porcelain)" ]; then
              echo "📝 Detected living documentation updates. Committing and pushing to quant-architecture..."
              git config user.name "Quant Doc Bot"
              git config user.email "bot@quant.internal"
              git commit -am "docs: auto-sync living architecture from ${{ github.sha }}"
              git push origin master || echo "⚠️ Could not push to remote origin master. Committed locally."
              echo "✅ quant-architecture successfully updated!"
            else
              echo "✅ Living documentation in quant-architecture is already fully synchronized."
            fi
          elif [ -n "${{ secrets.DOCS_SYNC_PAT }}" ]; then
            echo "📥 Cloning quant-architecture via DOCS_SYNC_PAT..."
            TMP_DIR="/tmp/quant-architecture"
            rm -rf "$TMP_DIR"
            git clone "https://x-access-token:${{ secrets.DOCS_SYNC_PAT }}@github.com/synology-dev-projects/quant-architecture.git" "$TMP_DIR"
            if [ -d "${{ env.DEPLOY_DIR }}/docs" ]; then
              cp -r "${{ env.DEPLOY_DIR }}/docs/"* "$TMP_DIR/docs/" 2>/dev/null || true
            fi
            cd "$TMP_DIR"
            if [ -n "$(git status --porcelain)" ]; then
              git config user.name "Quant Doc Bot"
              git config user.email "bot@quant.internal"
              git commit -am "docs: auto-sync living architecture from ${{ github.sha }}"
              git push origin master
              echo "✅ quant-architecture pushed to GitHub origin master via PAT!"
            fi
            rm -rf "$TMP_DIR"
          else
            echo "ℹ️ quant-architecture directory not found at $ARCH_DIR and no DOCS_SYNC_PAT provided; skipping auto-sync."
          fi
          echo "🎉 Stage 5 Documentation Sync Complete!"
