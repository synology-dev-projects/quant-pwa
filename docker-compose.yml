version: '3.8'

services:
  quant-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: quant-gateway-${CONTAINER_PREFIX:-prod}
    restart: unless-stopped
    environment:
      - APP_PASSCODE=${APP_PASSCODE:-quant-secret-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_GEMINI_MODEL=${DEFAULT_GEMINI_MODEL:-gemini-3.5-flash-lite}
      - GEXDEX_API_URL=${GEXDEX_API_URL:-http://gexdex-api-prod:8000}
      - GEXDEX_API_KEY=${GEXDEX_API_KEY}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - MAX_SLIDING_WINDOW_MESSAGES=12
    volumes:
      - ${COMMON_LIB_PATH:-../common-lib/common_lib}:/app/common_lib:ro
      - ${COMMON_CONFIG_PATH:-../common_config}:/app/common_config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      quant-net:
        aliases:
          - quant-gateway-${CONTAINER_PREFIX:-prod}

  quant-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quant-frontend-${CONTAINER_PREFIX:-prod}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8095}:80"
    environment:
      - CONTAINER_PREFIX=${CONTAINER_PREFIX:-prod}
    depends_on:
      - quant-gateway
    networks:
      quant-net:
        aliases:
          - quant-frontend-${CONTAINER_PREFIX:-prod}

  # Cloudflare Tunnel: Active in production profile only (master branch)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: quant-cloudflared-${CONTAINER_PREFIX:-prod}
    restart: unless-stopped
    profiles:
      - production
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - quant-frontend
    networks:
      - quant-net

networks:
  quant-net:
    name: quant-system-network
    external: true
