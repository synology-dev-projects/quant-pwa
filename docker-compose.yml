version: '3.8'

services:
  quant-db:
    image: timescale/timescaledb:latest-pg16
    container_name: quant-db-${CONTAINER_PREFIX:-prod}
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-quant_db}
      - POSTGRES_USER=${POSTGRES_USER:-quant_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-quant_secure_pass}
    volumes:
      - quant-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quant_admin} -d ${POSTGRES_DB:-quant_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      quant-net:
        aliases:
          - quant-db-${CONTAINER_PREFIX:-prod}
          - quant-db

  quant-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: quant-gateway-${CONTAINER_PREFIX:-prod}
    restart: unless-stopped
    environment:
      - APP_PASSCODE=${APP_PASSCODE:-quant-secret-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_GEMINI_MODEL=${DEFAULT_GEMINI_MODEL:-gemini-3.5-flash-lite}
      - GEXDEX_API_URL=${GEXDEX_API_URL:-http://gexdex-api-prod:8000}
      - GEXDEX_API_KEY=${GEXDEX_API_KEY}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - DB_TYPE=${DB_TYPE:-postgres}
      - POSTGRES_HOST=quant-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-quant_db}
      - POSTGRES_USER=${POSTGRES_USER:-quant_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-quant_secure_pass}
      - MAX_SLIDING_WINDOW_MESSAGES=12
    volumes:
      - ${COMMON_LIB_PATH:-../common-lib/common_lib}:/app/common_lib:ro
      - ${COMMON_CONFIG_PATH:-../common_config}:/app/common_config:ro
    depends_on:
      - quant-db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      quant-net:
        aliases:
          - quant-gateway-${CONTAINER_PREFIX:-prod}

  quant-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quant-frontend-${CONTAINER_PREFIX:-prod}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8095}:80"
    environment:
      - CONTAINER_PREFIX=${CONTAINER_PREFIX:-prod}
    depends_on:
      - quant-gateway
    networks:
      quant-net:
        aliases:
          - quant-frontend-${CONTAINER_PREFIX:-prod}

  # Cloudflare Tunnel: Active in production profile only (master branch)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: quant-cloudflared-${CONTAINER_PREFIX:-prod}
    restart: unless-stopped
    profiles:
      - production
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - quant-frontend
    networks:
      - quant-net

networks:
  quant-net:
    name: quant-system-network
    external: true

volumes:
  quant-db-data:
    name: quant-db-data-${CONTAINER_PREFIX:-prod}
