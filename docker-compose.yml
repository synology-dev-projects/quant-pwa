version: '3.8'

services:
  quant-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: quant-gateway
    restart: unless-stopped
    environment:
      - APP_PASSCODE=${APP_PASSCODE:-quant-secret-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_GEMINI_MODEL=${DEFAULT_GEMINI_MODEL:-gemini-3.7-flash}
      - GEXDEX_API_URL=${GEXDEX_API_URL:-http://gexdex-api-prod:8000}
      - GEXDEX_API_KEY=${GEXDEX_API_KEY}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - MAX_SLIDING_WINDOW_MESSAGES=12
    networks:
      - quant-net

  quant-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quant-frontend
    restart: unless-stopped
    ports:
      - "8095:80"
    depends_on:
      - quant-gateway
    networks:
      - quant-net

  # Cloudflare Tunnel for secure zero-open-port remote access
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: quant-cloudflared
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - quant-frontend
    networks:
      - quant-net

networks:
  quant-net:
    name: quant-system-network
    external: true
